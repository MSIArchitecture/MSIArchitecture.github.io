<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MSI Architecture</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f7f5;
    color: #222;
}


/* =========================================================
   MAIN PAGE
   ========================================================= */

.page {
    position: fixed;
    inset: 0;
    overflow: hidden;

    background:
        linear-gradient(
            115deg,
            rgba(255,255,255,0.98) 0%,
            rgba(246,246,243,0.96) 42%,
            rgba(239,239,235,0.92) 100%
        );

    transform: scale(0.92);
    opacity: 0;
    filter: blur(5px);

    transform-origin: center center;

    animation:
        pageForward 1.45s cubic-bezier(0.16, 1, 0.3, 1) 2.45s forwards;
}


/* =========================================================
   ARCHITECTURAL BACKGROUND
   ========================================================= */

.page::before {
    content: "";
    position: absolute;
    inset: -15%;

    background:
        linear-gradient(
            110deg,
            transparent 0%,
            transparent 35%,
            rgba(255,255,255,0.72) 35.2%,
            rgba(255,255,255,0.72) 35.5%,
            transparent 35.7%
        ),
        linear-gradient(
            70deg,
            transparent 0%,
            transparent 63%,
            rgba(255,255,255,0.55) 63.2%,
            rgba(255,255,255,0.55) 63.5%,
            transparent 63.7%
        );

    transform: rotate(-2deg);
    pointer-events: none;
}


/* Large architectural plane */

.page::after {
    content: "";
    position: absolute;

    width: 65vw;
    height: 120vh;

    right: -15vw;
    top: -10vh;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.65),
            rgba(225,225,220,0.42)
        );

    transform:
        perspective(1000px)
        rotateY(-18deg)
        rotateZ(4deg);

    box-shadow:
        -40px 0 100px rgba(0,0,0,0.035);

    pointer-events: none;
}


/* =========================================================
   TOP DESCRIPTOR WORDS
   ========================================================= */

.top-labels {
    position: absolute;
    top: 42px;
    left: 0;
    width: 100%;

    display: grid;
    grid-template-columns: 1fr 1fr 1fr;

    padding: 0 48px;

    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;

    color: #333;

    z-index: 10;
}

.top-labels span:nth-child(1) {
    text-align: left;
}

.top-labels span:nth-child(2) {
    text-align: center;
}

.top-labels span:nth-child(3) {
    text-align: right;
}


/* =========================================================
   FROSTED / RIBBED GLASS
   ========================================================= */

.glass {
    position: absolute;

    left: 0;
    top: 0;

    width: 42vw;
    height: 100vh;

    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,0.18) 0px,
            rgba(255,255,255,0.18) 2px,
            rgba(255,255,255,0.025) 2px,
            rgba(255,255,255,0.025) 7px
        );

    backdrop-filter: blur(2px);

    opacity: 0.65;

    transform:
        perspective(1000px)
        rotateY(12deg)
        translateX(-4vw);

    pointer-events: none;
}


/* =========================================================
   MAIN LOGO
   ========================================================= */

.main-logo {
    position: absolute;

    left: 72vw;
    top: 50%;

    transform: translate(-50%, -50%);

    width: clamp(330px, 34vw, 520px);

    height: auto;

    z-index: 8;
}


/* =========================================================
   CONTACT DETAILS
   ========================================================= */

.contact {
    position: absolute;

    left: 48px;
    bottom: 42px;

    z-index: 10;

    display: flex;
    flex-direction: column;
    gap: 7px;

    font-size: 12px;
    letter-spacing: 0.04em;

    color: #333;
}

.contact a {
    color: inherit;
    text-decoration: none;
}

.contact a:hover {
    text-decoration: underline;
}


/* =========================================================
   INTRO SCREEN
   ========================================================= */

.intro-screen {
    position: fixed;
    inset: 0;

    z-index: 100;

    background: #fff;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    animation:
        introSlideAway 1.25s cubic-bezier(0.77, 0, 0.175, 1) 2.45s forwards;
}


/* =========================================================
   INTRO LOGO
   ========================================================= */

.intro-logo {
    position: relative;

    width: clamp(264px, 33.6vw, 504px);

    height: auto;

    display: block;

    overflow: visible;
}


/* Actual logo */

.intro-logo img {
    display: block;

    width: 100%;
    height: auto;

    position: relative;
    z-index: 1;
}


/* =========================================================
   LOGO REVEAL MASKS
   ---------------------------------------------------------
   Two white panels initially cover the logo.
   They move outward, revealing the logo from the centre.
   ========================================================= */

.logo-reveal-left,
.logo-reveal-right {
    position: absolute;

    top: 0;

    width: 50%;
    height: 100%;

    background: #fff;

    z-index: 3;

    pointer-events: none;
}

.logo-reveal-left {
    left: 0;

    transform: translateX(0);

    animation:
        revealLeft 1s cubic-bezier(0.77, 0, 0.175, 1)
        0.25s forwards;
}

.logo-reveal-right {
    right: 0;

    transform: translateX(0);

    animation:
        revealRight 1s cubic-bezier(0.77, 0, 0.175, 1)
        0.25s forwards;
}


/* =========================================================
   LOGO DISAPPEARANCE
   ---------------------------------------------------------
   A white bar begins at the centre and expands outward.
   This gives the exact "centre → outward" disappearance.
   ========================================================= */

.logo-conceal {
    position: absolute;

    left: 50%;
    top: 0;

    width: 0;
    height: 100%;

    background: #fff;

    transform: translateX(-50%);

    z-index: 5;

    pointer-events: none;

    animation:
        concealLogo 0.9s cubic-bezier(0.77, 0, 0.175, 1)
        1.55s forwards;
}


/* =========================================================
   LOGO ANIMATIONS
   ========================================================= */

@keyframes revealLeft {

    0% {
        transform: translateX(0);
    }

    100% {
        transform: translateX(-105%);
    }

}

@keyframes revealRight {

    0% {
        transform: translateX(0);
    }

    100% {
        transform: translateX(105%);
    }

}


@keyframes concealLogo {

    0% {
        width: 0;
    }

    100% {
        width: 110%;
    }

}


/* =========================================================
   MAIN PAGE FORWARD MOTION
   ========================================================= */

@keyframes pageForward {

    0% {
        transform: scale(0.92);
        opacity: 0;
        filter: blur(5px);
    }

    35% {
        opacity: 0.55;
        filter: blur(2.5px);
    }

    70% {
        opacity: 0.88;
        filter: blur(0.8px);
    }

    100% {
        transform: scale(1);
        opacity: 1;
        filter: blur(0);
    }

}


/* =========================================================
   WHITE INTRO SLIDES AWAY
   ========================================================= */

@keyframes introSlideAway {

    0% {
        transform: translateX(0);
    }

    100% {
        transform: translateX(-100%);
    }

}


/* =========================================================
   LANDSCAPE
   ========================================================= */

@media (max-height: 600px) and (orientation: landscape) {

    .top-labels {
        top: 25px;
        padding: 0 32px;
    }

    .contact {
        left: 32px;
        bottom: 25px;
    }

    .main-logo {
        left: 75%;
        top: 50%;

        width: clamp(230px, 34vw, 360px);
    }

    .intro-logo {
        width: 50.4vw;
        max-width: 360px;
    }

}


/* =========================================================
   PORTRAIT / MOBILE
   ========================================================= */

@media (orientation: portrait) {

    .page {
        overflow: hidden;
    }

    .top-labels {
        top: 28px;

        padding: 0 24px;

        font-size: 9px;
        letter-spacing: 0.14em;
    }

    .glass {
        width: 100vw;
        height: 48vh;

        left: -12vw;
        top: 0;

        transform:
            perspective(900px)
            rotateY(0deg)
            rotateZ(-4deg);
    }

    .main-logo {
        left: 50%;
        top: 79vh;

        transform: translate(-50%, -50%);

        width: clamp(270px, 72vw, 390px);
    }

    .contact {
        left: 24px;
        bottom: 28px;

        font-size: 11px;
    }

    .intro-logo {
        width: 81.6vw;
        max-width: 396px;
    }

}


/* =========================================================
   VERY SMALL MOBILE
   ========================================================= */

@media (max-width: 380px) and (orientation: portrait) {

    .top-labels {
        padding: 0 18px;

        font-size: 8px;
    }

    .main-logo {
        top: 79vh;
        bottom: auto;

        width: 270px;
    }

    .contact {
        left: 18px;
        bottom: 22px;
    }

    .intro-logo {
        width: 270px;
    }

}


/* =========================================================
   ACCESSIBILITY
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    .intro-screen {
        display: none;
    }

    .page {
        transform: none;
        opacity: 1;
        filter: none;
        animation: none;
    }

}

</style>
</head>


<body>


<!-- =======================================================
     MAIN PAGE
     ======================================================= -->

<div class="page">


    <!-- Top descriptor words -->

    <div class="top-labels">
        <span>Architecture</span>
        <span>Interiors</span>
        <span>Planning</span>
    </div>


    <!-- Frosted ribbed glass -->

    <div class="glass"></div>


    <!-- Main logo -->

    <img
        class="main-logo"
        src="MSI 2025 Rebrand Logo.png"
        alt="MSI Architecture"
    >


    <!-- Contact -->

    <div class="contact">

        <a href="mailto:info@msi-architecture.co.uk">
            info@msi-architecture.co.uk
        </a>

        <a href="tel:01617100855">
            0161 710 0855
        </a>

    </div>

</div>



<!-- =======================================================
     OPENING INTRO
     ======================================================= -->

<div class="intro-screen">

    <div class="intro-logo">

        <!-- Real MSI logo -->

        <img
            src="MSI 2025 Rebrand Logo.png"
            alt="MSI Architecture"
        >


        <!-- Reveal from centre outward -->

        <div class="logo-reveal-left"></div>
        <div class="logo-reveal-right"></div>


        <!-- Disappear from centre outward -->

        <div class="logo-conceal"></div>

    </div>

</div>


</body>
</html>
