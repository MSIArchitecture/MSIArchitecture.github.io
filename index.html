<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MSI Architecture</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f7f5;
    color: #222;
    overflow: hidden;
}


/* =========================
   MAIN PAGE
========================= */

.page {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 600px;
    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.98) 0%,
            rgba(247,247,245,0.98) 52%,
            rgba(238,238,235,0.98) 100%
        );
}


/* =========================
   ARCHITECTURAL BACKGROUND
========================= */

.architecture {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 1;
}

.architecture::before {
    content: "";
    position: absolute;

    width: 58vw;
    height: 125vh;

    left: 40%;
    top: -8%;

    transform: skewX(-14deg);

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,0.98) 0%,
            rgba(244,244,241,0.95) 48%,
            rgba(224,224,220,0.90) 100%
        );

    box-shadow:
        -30px 0 70px rgba(0,0,0,0.035);
}

.architecture::after {
    content: "";
    position: absolute;

    width: 42vw;
    height: 90vh;

    right: -10%;
    bottom: -25%;

    transform: rotate(-12deg);

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,0.95),
            rgba(229,229,225,0.82)
        );

    box-shadow:
        0 -30px 80px rgba(0,0,0,0.035);
}


/* =========================
   FROSTED GLASS
========================= */

.glass-zone {
    position: absolute;

    right: 4vw;
    top: 7vh;

    width: 31vw;
    height: 86vh;

    z-index: 2;

    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,0.48) 0px,
            rgba(255,255,255,0.48) 3px,
            rgba(215,215,211,0.28) 4px,
            rgba(255,255,255,0.22) 10px
        );

    backdrop-filter: blur(4px);

    border-left: 1px solid rgba(255,255,255,0.8);
    border-right: 1px solid rgba(255,255,255,0.65);

    box-shadow:
        -30px 0 80px rgba(0,0,0,0.045),
        30px 0 80px rgba(255,255,255,0.4);
}


/* =========================
   REAL MSI LOGO
========================= */

.logo {
    position: absolute;

    left: 72vw;
    top: 50%;

    transform: translate(-50%, -50%);

    width: clamp(330px, 34vw, 520px);

    z-index: 6;
}

.logo img {
    display: block;

    width: 100%;
    height: auto;
}


/* =========================
   PRACTICE TYPE
========================= */

.practice {
    position: absolute;

    left: 7vw;
    top: 8vh;

    z-index: 6;

    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;

    color: #555;
}


/* =========================
   MAIN MESSAGE
========================= */

.message {
    position: absolute;

    left: 7vw;
    top: 50%;

    transform: translateY(-50%);

    width: min(620px, 48vw);

    z-index: 6;
}

.message h1 {
    margin: 0;

    font-size: clamp(48px, 5vw, 82px);
    line-height: 0.98;
    font-weight: 500;
    letter-spacing: -0.045em;

    color: #222;
}

.intro {
    margin-top: 32px;

    max-width: 510px;

    font-size: 17px;
    line-height: 1.65;

    color: #555;
}

.contact {
    margin-top: 48px;

    display: flex;
    flex-direction: column;
    align-items: flex-start;

    gap: 6px;
}

.contact-title {
    margin-bottom: 6px;

    font-size: 10px;
    line-height: 1;
    letter-spacing: 0.18em;
    text-transform: uppercase;

    color: #888;
}

.contact a {
    color: #222;

    font-size: 14px;

    text-decoration: none;

    border-bottom: 1px solid rgba(34,34,34,0.22);
}

.contact a:hover {
    border-bottom-color: #222;
}


/* =========================
   PORTRAIT MOBILE
========================= */

@media (max-width: 700px) and (orientation: portrait) {

    body {
        overflow: hidden;
    }

    .page {
        height: 100svh;
        min-height: 560px;
    }

    .practice {
        left: 8vw;
        top: 7vh;

        font-size: 8px;
        letter-spacing: 0.15em;
    }

    .message {
        left: 8vw;
        top: 19vh;

        transform: none;

        width: 84vw;
    }

    .message h1 {
        font-size: clamp(38px, 11vw, 58px);
        line-height: 0.98;
    }

    .intro {
        margin-top: 24px;

        max-width: 82vw;

        font-size: 14px;
        line-height: 1.55;
    }

    .contact {
        margin-top: 30px;
    }

    .contact-title {
        font-size: 9px;
    }

    .contact a {
        font-size: 12px;
    }

    .glass-zone {
        right: -8vw;
        top: 52vh;

        width: 72vw;
        height: 54vh;
    }

    /*
       Portrait mobile:
       Logo centred horizontally.
       Logo centre positioned in the lower
       space between the contact details
       and the bottom of the page.
    */

    .logo {
        left: 50%;
        top: 79vh;

        transform: translate(-50%, -50%);

        width: clamp(270px, 72vw, 390px);
    }
}


/* =========================
   LANDSCAPE MOBILE
========================= */

@media (max-width: 900px) and (orientation: landscape) {

    .page {
        height: 100svh;
        min-height: 420px;
    }

    .practice {
        left: 6vw;
        top: 8vh;

        font-size: 8px;
    }

    .message {
        left: 6vw;
        top: 52%;

        width: 52vw;
    }

    .message h1 {
        font-size: clamp(34px, 6vw, 58px);
    }

    .intro {
        margin-top: 20px;

        max-width: 48vw;

        font-size: 12px;
        line-height: 1.5;
    }

    .contact {
        margin-top: 22px;
    }

    .contact a {
        font-size: 11px;
    }

    .glass-zone {
        right: 3vw;
        top: 6vh;

        width: 38vw;
        height: 88vh;
    }

    .logo {
        left: 75%;
        top: 50%;

        transform: translate(-50%, -50%);

        width: clamp(230px, 34vw, 360px);
    }
}


/* =========================
   VERY SMALL PORTRAIT
========================= */

@media (max-width: 380px) and (orientation: portrait) {

    .practice {
        top: 6vh;
    }

    .message {
        top: 17vh;
    }

    .message h1 {
        font-size: 37px;
    }

    .intro {
        margin-top: 20px;
        font-size: 13px;
    }

    .contact {
        margin-top: 25px;
    }

    .glass-zone {
        top: 55vh;
    }

    .logo {
        top: 79vh;
        bottom: auto;

        width: 270px;

        transform: translate(-50%, -50%);
    }
}

</style>
</head>


<body>

<div class="page">

    <div class="architecture"></div>

    <div class="glass-zone"></div>


    <!-- MSI Architecture logo -->

    <div class="logo">
        <img src="MSI 2025 Rebrand Logo.png" alt="MSI Architecture">
    </div>


    <div class="practice">
        Architecture&nbsp;&nbsp;·&nbsp;&nbsp;
        Interior&nbsp;&nbsp;·&nbsp;&nbsp;
        Planning
    </div>


    <div class="message">

        <h1>
            Something exciting<br>
            is taking shape.
        </h1>

        <div class="intro">
            Our new website is currently under development.
            We're looking forward to sharing more about
            MSI Architecture, our work and our approach to design.
        </div>


        <div class="contact">

            <div class="contact-title">
                Get in touch
            </div>

            <a href="mailto:info@msi-architecture.co.uk">
                info@msi-architecture.co.uk
            </a>

            <a href="tel:+441617100855">
                0161 710 0855
            </a>

        </div>

    </div>

</div>

</body>
</html>
