<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MSI Architecture | Coming Soon</title>

<meta name="description" content="MSI Architecture — our new website is currently under development.">

<style>

/* =========================================================
   BASIC SETTINGS
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: #252525;
    background: #f7f7f5;
}


/* =========================================================
   MAIN PAGE
   ========================================================= */

.page {
    position: relative;

    width: 100%;
    min-height: 100vh;
    min-height: 100svh;

    overflow: hidden;

    background:
        linear-gradient(
            105deg,
            #ffffff 0%,
            #fafafa 42%,
            #eeeeeb 100%
        );
}


/* =========================================================
   ARCHITECTURAL BACKGROUND
   ========================================================= */

.architecture {
    position: absolute;

    right: -5%;
    top: -10%;

    width: 62%;
    height: 125%;

    transform: rotate(-7deg);

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(255,255,255,0.7) 18%,
            rgba(210,210,207,0.18) 19%,
            transparent 20%,
            transparent 39%,
            rgba(255,255,255,0.75) 40%,
            rgba(210,210,207,0.16) 41%,
            transparent 42%,
            transparent 65%,
            rgba(255,255,255,0.65) 66%,
            rgba(210,210,207,0.12) 67%,
            transparent 68%
        );

    opacity: 0.9;
}


/* =========================================================
   RIBBED GLASS
   ========================================================= */

.glass-zone {
    position: absolute;

    right: 7%;
    top: 10%;

    width: 48%;
    height: 80%;

    overflow: hidden;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,0.25),
            rgba(255,255,255,0.62),
            rgba(255,255,255,0.20)
        );

    border-left: 1px solid rgba(255,255,255,0.75);
    border-right: 1px solid rgba(255,255,255,0.65);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    opacity: 0.9;
}


.glass-zone::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,0.00) 0px,
            rgba(255,255,255,0.00) 7px,
            rgba(255,255,255,0.58) 8px,
            rgba(255,255,255,0.58) 10px,
            rgba(170,170,168,0.08) 11px,
            rgba(170,170,168,0.08) 16px
        );

    opacity: 0.75;
}


/* =========================================================
   TEMPORARY MSI LOGO
   ========================================================= */

.logo {

    position: absolute;

    right: 16%;
    top: 50%;

    transform: translateY(-50%);

    display: flex;

    flex-direction: column;

    align-items: flex-start;

    z-index: 5;
}


.logo-top {

    display: flex;

    gap: 8px;
}


.logo-box {

    width: clamp(70px, 7vw, 115px);
    height: clamp(70px, 7vw, 115px);

    display: flex;

    align-items: center;
    justify-content: center;

    background: #080808;

    color: white;

    font-size: clamp(42px, 5vw, 78px);

    font-weight: 300;

    line-height: 1;
}


.logo-bottom {

    display: flex;

    align-items: center;

    gap: 25px;

    margin-top: 22px;

    width: 100%;
}


.logo-line {

    height: 18px;

    background: #080808;

    flex: 1;
}


.logo-small {

    width: 70px;

    height: 18px;

    background: #080808;
}


/* =========================================================
   CONTENT
   ========================================================= */

.content {

    position: relative;

    z-index: 10;

    width: 100%;

    min-height: 100vh;
    min-height: 100svh;

    padding: 55px 6vw;

    display: flex;

    flex-direction: column;

    justify-content: space-between;
}


/* =========================================================
   TOP LABEL
   ========================================================= */

.practice {

    font-size: 12px;

    letter-spacing: 0.16em;

    text-transform: uppercase;

    color: #3f3f3d;
}


/* =========================================================
   MAIN MESSAGE
   ========================================================= */

.message {

    max-width: 670px;

    margin-top: auto;
    margin-bottom: auto;
}


h1 {

    margin: 0 0 34px;

    max-width: 720px;

    font-size: clamp(52px, 7.5vw, 105px);

    line-height: 0.91;

    letter-spacing: -0.055em;

    font-weight: 500;

    color: #292927;
}


.intro {

    max-width: 540px;

    font-size: clamp(16px, 1.35vw, 20px);

    line-height: 1.55;

    color: #575754;
}


/* =========================================================
   CONTACT
   ========================================================= */

.contact {

    margin-top: 42px;

    padding-top: 14px;

    border-top: 1px solid rgba(35,35,35,0.22);

    width: fit-content;

    display: flex;

    flex-direction: column;

    gap: 7px;
}


.contact-title {

    margin-bottom: 4px;

    font-size: 10px;

    letter-spacing: 0.18em;

    text-transform: uppercase;

    color: #4b4b48;
}


.contact a {

    font-size: 15px;

    color: #292927;

    text-decoration: none;
}


.contact a:hover {

    text-decoration: underline;
}


/* =========================================================
   PORTRAIT PHONES
   ========================================================= */

@media (max-width: 800px) and (orientation: portrait) {

    .page {

        min-height: 100svh;

        overflow: hidden;
    }


    .content {

        padding: 28px 7vw 34px;

        min-height: 100svh;

        justify-content: flex-start;
    }


    .practice {

        font-size: 10px;

        letter-spacing: 0.14em;

        line-height: 1.5;

        max-width: 90%;
    }


    .message {

        margin-top: 15vh;

        margin-bottom: 0;

        max-width: 100%;
    }


    h1 {

        margin-bottom: 24px;

        font-size: clamp(48px, 15vw, 76px);

        line-height: 0.91;

        letter-spacing: -0.055em;

        max-width: 95%;
    }


    .intro {

        max-width: 92%;

        font-size: 16px;

        line-height: 1.5;
    }


    .contact {

        margin-top: 28px;

        padding-top: 12px;

        gap: 6px;
    }


    .contact a {

        font-size: 14px;
    }


    /* Move the architectural glass behind the lower page */

    .architecture {

        right: -35%;

        top: 42%;

        width: 115%;

        height: 70%;

        transform: rotate(-8deg);

        opacity: 0.75;
    }


    .glass-zone {

        right: -22%;

        top: 47%;

        width: 92%;

        height: 58%;

        opacity: 0.72;

        backdrop-filter: blur(12px);

        -webkit-backdrop-filter: blur(12px);
    }


    /* Move temporary logo into the visual area */

    .logo {

        right: 8%;

        top: 76%;

        transform: translateY(-50%);

        z-index: 5;

        opacity: 0.92;
    }


    .logo-top {

        gap: 5px;
    }


    .logo-box {

        width: 52px;

        height: 52px;

        font-size: 30px;
    }


    .logo-bottom {

        margin-top: 9px;

        gap: 10px;
    }


    .logo-line {

        height: 9px;
    }


    .logo-small {

        width: 35px;

        height: 9px;
    }
}


/* =========================================================
   LANDSCAPE PHONES
   ========================================================= */

@media (max-width: 900px) and (orientation: landscape) {

    .page {

        min-height: 100svh;

        overflow: hidden;
    }


    .content {

        min-height: 100svh;

        padding: 24px 6vw;

        justify-content: space-between;
    }


    .practice {

        font-size: 9px;

        letter-spacing: 0.14em;
    }


    .message {

        margin-top: 0;

        margin-bottom: 0;

        max-width: 54%;
    }


    h1 {

        margin-bottom: 16px;

        font-size: clamp(38px, 7vw, 64px);

        line-height: 0.9;
    }


    .intro {

        max-width: 480px;

        font-size: 14px;

        line-height: 1.4;
    }


    .contact {

        margin-top: 18px;

        padding-top: 9px;

        gap: 4px;
    }


    .contact-title {

        font-size: 8px;

        margin-bottom: 2px;
    }


    .contact a {

        font-size: 12px;
    }


    .architecture {

        right: -8%;

        top: -12%;

        width: 65%;

        height: 125%;

        transform: rotate(-7deg);
    }


    .glass-zone {

        right: 2%;

        top: 5%;

        width: 48%;

        height: 90%;

        opacity: 0.82;
    }


    .logo {

        right: 13%;

        top: 50%;

        transform: translateY(-50%);

        z-index: 5;
    }


    .logo-top {

        gap: 5px;
    }


    .logo-box {

        width: 48px;

        height: 48px;

        font-size: 28px;
    }


    .logo-bottom {

        margin-top: 9px;

        gap: 10px;
    }


    .logo-line {

        height: 8px;
    }


    .logo-small {

        width: 34px;

        height: 8px;
    }
}


/* =========================================================
   VERY SMALL PORTRAIT PHONES
   ========================================================= */

@media (max-width: 390px) and (orientation: portrait) {

    .content {

        padding-left: 6vw;

        padding-right: 6vw;
    }


    .message {

        margin-top: 11vh;
    }


    h1 {

        font-size: 14vw;

        margin-bottom: 20px;
    }


    .intro {

        font-size: 15px;
    }


    .contact {

        margin-top: 24px;
    }


    .logo {

        top: 78%;
    }
}

</style>

</head>

            <div class="logo-box">M</div>

</body>
