<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MSI Architecture | Coming Soon</title>

<meta name="description" content="MSI Architecture — our new website is currently under development.">


<style>

/* =========================================================
   BASIC SETTINGS
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: #252525;
    background: #f7f7f5;
}


/* =========================================================
   MAIN BACKGROUND
   ========================================================= */

.page {
    position: relative;

    width: 100%;
    min-height: 100vh;

    overflow: hidden;

    background:
        linear-gradient(
            105deg,
            #ffffff 0%,
            #fafafa 42%,
            #eeeeeb 100%
        );
}


/* =========================================================
   SUBTLE ARCHITECTURAL BACKGROUND PLANES
   ========================================================= */

.architecture {
    position: absolute;

    right: -5%;
    top: -10%;

    width: 62%;
    height: 125%;

    transform: rotate(-7deg);

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(255,255,255,0.7) 18%,
            rgba(210,210,207,0.18) 19%,
            transparent 20%,
            transparent 39%,
            rgba(255,255,255,0.75) 40%,
            rgba(210,210,207,0.16) 41%,
            transparent 42%,
            transparent 65%,
            rgba(255,255,255,0.65) 66%,
            rgba(210,210,207,0.12) 67%,
            transparent 68%
        );

    opacity: 0.9;
}


/* =========================================================
   RIBBED GLASS EFFECT
   ========================================================= */

.glass-zone {
    position: absolute;

    right: 7%;
    top: 10%;

    width: 48%;
    height: 80%;

    overflow: hidden;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,0.25),
            rgba(255,255,255,0.62),
            rgba(255,255,255,0.20)
        );

    border-left: 1px solid rgba(255,255,255,0.75);
    border-right: 1px solid rgba(255,255,255,0.65);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    opacity: 0.9;
}


/* Vertical glass ribs */

.glass-zone::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,0.00) 0px,
            rgba(255,255,255,0.00) 7px,

            rgba(255,255,255,0.58) 8px,
            rgba(255,255,255,0.58) 10px,

            rgba(170,170,168,0.08) 11px,
            rgba(170,170,168,0.08) 16px
        );

    opacity: 0.75;
}


/* =========================================================
   LOGO
   ========================================================= */

.logo {

    position: absolute;

    right: 16%;
    top: 50%;

    transform:
        translateY(-50%);

    display: flex;

    flex-direction: column;

    align-items: flex-start;

    z-index: 5;
}


/* Three main MSI blocks */

.logo-top {

    display: flex;

    gap: 8px;
}


.logo-box {

    width: clamp(70px, 7vw, 115px);
    height: clamp(70px, 7vw, 115px);

    display: flex;

    align-items: center;
    justify-content: center;

    background: #080808;

    color: white;

    font-size: clamp(42px, 5vw, 78px);

    font-weight: 300;

    line-height: 1;
}


/* Logo bars underneath */

.logo-bottom {

    display: flex;

    align-items: center;

    gap: 25px;

    margin-top: 22px;

    width: 100%;
}


.logo-line {

    height: 18px;

    background: #080808;

    flex: 1;
}


.logo-small {

    width: 70px;

    height: 18px;

    background: #080808;
}


/* =========================================================
   CONTENT
   ========================================================= */

.content {

    position: relative;

    z-index: 10;

    width: 100%;

    min-height: 100vh;

    padding: 55px 6vw;

    display: flex;

    flex-direction: column;

    justify-content: space-between;
}


/* =========================================================
   TOP LABEL
   ========================================================= */

.practice {

    font-size: 12px;

    letter-spacing: 0.16em;

    text-transform: uppercase;

    color: #3f3f3d;
}


/* =========================================================
   MAIN MESSAGE
   ========================================================= */

.message {

    max-width: 670px;

    margin-top: auto;

    margin-bottom: auto;
}


h1 {

    margin: 0 0 34px;

    max-width: 720px;

    font-size: clamp(52px, 7.5vw, 105px);

    line-height: 0.91;

    letter-spacing: -0.055em;

    font-weight: 500;

    color: #292927;
}


.intro {

    max-width: 540px;

    font-size: clamp(16px, 1.35vw, 20px);

    line-height: 1.55;

    color: #575754;
}


/* =========================================================
   CONTACT
   ========================================================= */

.contact {

    margin-top: 42px;

    padding-top: 14px;

    border-top: 1px solid rgba(35,35,35,0.22);

    width: fit-content;

    display: flex;

    flex-direction: column;

    gap: 7px;
}


.contact-title {

    margin-bottom: 4px;

    font-size: 10px;

    letter-spacing: 0.18em;

    text-transform: uppercase;

    color: #4b4b48;
}


.contact a {

    font-size: 15px;

    color: #292927;

    text-decoration: none;
}


.contact a:hover {

    text-decoration: underline;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 800px) {

    .page {

        min-height: 100svh;

        overflow: auto;
    }


    .content {

        padding: 30px 7vw 40px;

        min-height: 100svh;
    }


    .glass-zone {

        right: -20%;

        top: 45%;

        width: 85%;

        height: 60%;

        opacity: 0.7;
    }


    .logo {

        right: 10%;

        top: 66%;

        transform: translateY(-50%);
    }


    .logo-box {

        width: 65px;

        height: 65px;

        font-size: 38px;
    }


    .logo-bottom {

        margin-top: 13px;

        gap: 12px;
    }


    .logo-line {

        height: 11px;
    }


    .logo-small {

        width: 45px;

        height: 11px;
    }


    .message {

        margin-top: 15vh;

        margin-bottom: 35vh;
    }


    h1 {

        font-size: 16vw;
    }


    .intro {

        font-size: 16px;

        max-width: 460px;
    }


    .contact {

        margin-top: 30px;
    }
}


</style>

</head>


<body>


<div class="page">


    <!-- Subtle architectural background -->

    <div class="architecture"></div>


    <!-- Frosted ribbed glass -->

    <div class="glass-zone"></div>


    <!-- MSI temporary logo -->

    <div class="logo">

        <div class="logo-top">

            <div class="logo-box">M</div>

            <div class="logo-box">S</div>

            <div class="logo-box">I</div>

        </div>


        <div class="logo-bottom">

            <div class="logo-line"></div>

            <div class="logo-small"></div>

        </div>

    </div>


    <!-- Main content -->

    <div class="content">


        <div class="practice">

            Architecture&nbsp;&nbsp;·&nbsp;&nbsp;
            Interior&nbsp;&nbsp;·&nbsp;&nbsp;
            Planning

        </div>


        <div class="message">


            <h1>

                Something exciting<br>
                is taking shape.

            </h1>


            <div class="intro">

                Our new website is currently under development.
                We're looking forward to sharing more about
                MSI Architecture, our work and our approach to design.

            </div>


            <div class="contact">


                <div class="contact-title">

                    Get in touch

                </div>


                <a href="mailto:info@msi-architecture.co.uk">

                    info@msi-architecture.co.uk

                </a>


                <a href="tel:+441617100855">

                    0161 710 0855

                </a>


            </div>


        </div>


    </div>


</div>


</body>

</html>
